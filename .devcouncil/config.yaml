execution:
  command_timeout: 2400
  default_executor: claude
  enforce_file_scope_pre_verify: true
  hook_gate:
    mode: 'off'
  stop_gate:
    check_claims: true
    mode: assist
    verify_active_task: true
gates:
  mode: false
integrations:
  antigravity:
    enabled: true
    mcp_config_path: .agents/mcp_config.json
  claude:
    enabled: true
    scope: local
    settings_path: .claude/settings.local.json
    write_gate: false
  cursor:
    config_path: .cursor/mcp.json
    enabled: true
    hooks_path: .cursor/hooks.json
    rules_path: .cursor/rules/devcouncil.mdc
    skills_path: .cursor/skills
    write_gate: false
  grok:
    config_path: .grok/config.toml
    enabled: true
    hooks_path: .grok/hooks/devcouncil.json
    write_gate: false
  opencode:
    config_path: opencode.json
    enabled: true
    write_gate: false
  warp:
    command: oz
    enabled: true
    mcp_config_path: .devcouncil/integrations/warp-mcp.json
    run_mode: local
  aider:
    enabled: true
  codex:
    write_gate: false
models:
  provider: openrouter
  roles:
    arbiter:
      model: qwen/qwen3-max
    critic_a:
      model: qwen/qwen3-max
    critic_b:
      model: qwen/qwen3-max
    implementation_reviewer:
      model: qwen/qwen3-max
    live_reviewer:
      model: qwen/qwen3-max
    native_agent:
      model: qwen/qwen3-max
    planner_a:
      model: qwen/qwen3-max
    planner_b:
      model: qwen/qwen3-max
    prompt_enhancer:
      model: qwen/qwen3-max
    spec_writer:
      model: qwen/qwen3-max
project:
  default_branch: main
  name: DevCouncil
  root: .
verification:
  diff_coverage:
    enforce: false
    measure: true
    min_ratio: 0.0
  rigor:
    acceptance_samples_on_hard: 2
    coarse_acceptance_proof: hard
    effort_heuristics: hard
    enabled: true
    enforce_coverage_on_hard: true
    extra_repair_attempts_on_hard: 1
    min_added_lines_per_planned_file: 5
    reviewer_required_on_hard: false
    stub_detection: hard
