name: Set up Gusset
description: >-
  Check out the Gusset revision the Go module replaces, and build the umbrella
  staticlib the DevCouncil host links. backend/go_orchestrator/go.mod replaces
  github.com/bharathvbcr/gusset with ../../../gusset, and rust/gusset-engine
  depends on that same sibling. A GitHub checkout of DevCouncil alone does not
  contain it.

inputs:
  build-engine:
    description: >-
      Build rust/gusset-engine in release. Required before any go build or
      go test of the host. Set to false when a job only needs the sibling
      sources on disk.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Check out Gusset
      uses: actions/checkout@v5
      with:
        repository: bharathvbcr/gusset
        # Pinned to the sibling revision this tree was linked against.
        # Bump deliberately; tracking main would let a Gusset push fail a
        # DevCouncil release without a DevCouncil commit.
        ref: d73226f0a659bd54cb498c4b2cffef037f52ba5b
        path: third_party/gusset
        persist-credentials: false

    - name: Link Gusset where the module replace looks
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          # GITHUB_WORKSPACE is a Windows path. Git Bash dirname does not
          # treat backslash as a separator, so convert first.
          workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
        else
          workspace="$GITHUB_WORKSPACE"
        fi
        src="$workspace/third_party/gusset"
        dest="$(dirname "$workspace")/gusset"
        if [[ ! -f "$src/go.mod" || ! -f "$src/crates/gusset/Cargo.toml" ]]; then
          echo "::error::Gusset checkout at $src is incomplete"
          exit 1
        fi
        if [[ -e "$dest" || -L "$dest" ]]; then
          echo "::error::$dest already exists; refusing to replace it"
          exit 1
        fi
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          # A junction, not a symlink: the runner can create one without
          # Developer Mode, and both Go and Cargo follow it.
          cmd.exe //c "mklink /J $(cygpath -w "$dest") $(cygpath -w "$src")"
        else
          ln -s "$src" "$dest"
        fi
        test -f "$dest/go.mod"
        test -f "$dest/crates/gusset/Cargo.toml"

    # gusset is unix-only: its crate refuses other targets with compile_error!,
    # so no Windows toolchain can build the archive. On Windows the sibling is
    # still checked out (go.mod's replace must resolve) and the host builds
    # without it — gussetfn is build-tagged unix and answers ErrUnsupported
    # elsewhere. The MinGW/gnu-target path this replaced could never succeed.
    - name: Rust toolchain
      if: ${{ runner.os != 'Windows' && inputs.build-engine == 'true' }}
      uses: dtolnay/rust-toolchain@stable

    - name: Build the umbrella staticlib
      if: ${{ runner.os != 'Windows' && inputs.build-engine == 'true' }}
      shell: bash
      working-directory: rust/gusset-engine
      run: |
        set -euo pipefail
        cargo build --release --locked
        test -f target/release/libgusset.a
        # Key Go's build and test caches on the archive (see cgo-env.sh):
        # setup-go restores GOCACHE, and without this a cached link or a
        # cached "ok" from an older archive is replayed.
        # The -L is already in gussetfn/engine.go; only the key is needed here.
        ./cgo-env.sh --no-build | grep -v "^CGO_LDFLAGS=" >> "$GITHUB_ENV"
