name: Set up Rust
description: >-
  Install the toolchain rust-toolchain.toml at the repository root pins, with
  its components. No workflow names a channel: dtolnay/rust-toolchain selects
  a toolchain from its own ref (`@stable`) or an explicit input and does not
  read rust-toolchain.toml, so an unpinned `stable` could drift under
  `-D warnings` and turn main red without a commit. Needs a checkout first.

inputs:
  targets:
    description: Comma-separated extra targets, e.g. x86_64-unknown-linux-musl.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install the pinned toolchain
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        test -f rust-toolchain.toml || { echo "::error::rust-toolchain.toml is missing; checkout must run first"; exit 1; }
        # With no arguments rustup installs the toolchain, profile and
        # components that rust-toolchain.toml selects for this directory.
        rustup toolchain install --no-self-update
        if [[ -n "$TARGETS" ]]; then
          rustup target add ${TARGETS//,/ }
        fi
        # Echo what is in force so a drift from the file is visible in the log.
        rustc --version --verbose
        cargo --version
