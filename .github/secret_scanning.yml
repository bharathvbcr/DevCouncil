# Secret scanning exclusions. Keep this list to files whose credential-shaped
# values are synthetic by construction, and never widen it to a directory.
#
# rust/dc-verify/tests/corpus/secrets*.tsv are the hand-labelled corpora that
# measure dc-verify's `scan_secrets` as a classifier (read by
# rust/dc-verify/tests/classifier_corpus.rs). Every positive row is a
# vendor-shaped fake token on purpose; the gate cannot be measured without them.
# cases.txt and the rest of the corpus directory stay scanned.
paths-ignore:
  - "rust/dc-verify/tests/corpus/secrets*.tsv"
