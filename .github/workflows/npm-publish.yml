name: npm Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Check npm package contents
        run: |
          npm run pack:check
          npm run smoke:package

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish package
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: Registry smoke + GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Derive package version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Registry smoke (required before release complete)
        env:
          NPM_REGISTRY_SMOKE_VERSION: ${{ steps.ver.outputs.version }}
          NPM_REGISTRY_SMOKE_TIMEOUT: "600"
        run: npm run smoke:registry
      - name: Create GitHub Release with judge notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          NOTES_FILE="docs/judge-release-notes.md"
          BODY_FILE="$(mktemp)"
          {
            echo "## DevCouncil ${TAG}"
            echo
            echo "npm package: ${VERSION} (JS shim; install Go \`devcouncil\` and Rust \`devmap\` separately)"
            echo
            echo "Registry smoke passed before this release was marked complete."
            echo
            cat "$NOTES_FILE"
          } > "$BODY_FILE"
          gh release create "$TAG" --title "DevCouncil ${TAG}" --notes-file "$BODY_FILE" "$NOTES_FILE"
