name: npm Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# One run per workflow and ref: a newer push supersedes the one in flight.
# Tag refs are never cancelled, so a release cannot be cut off by a later push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # check:release runs cmd/dcrelease, a standard-library Go command.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go_orchestrator/go.mod
          cache-dependency-path: backend/go_orchestrator/go.mod

      - name: Release identity
        run: npm run check:release

      - name: Check npm package contents
        run: |
          npm run pack:check
          npm run smoke:package

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      published: ${{ steps.decide.outputs.published }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Decide whether this version is new
        id: decide
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::tag ${TAG} does not match package.json ${VERSION}"
            exit 1
          fi
          # A registry that cannot be reached must not look like "unpublished".
          npm ping
          VIEWED="$(npm view "devcouncil@${VERSION}" version 2>/dev/null || true)"
          if [ "$VIEWED" = "$VERSION" ]; then
            echo "devcouncil@${VERSION} is already on the npm registry; skipping publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$VIEWED" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::unexpected npm view output for devcouncil@${VERSION}: ${VIEWED}"
            exit 1
          fi

      - name: Publish package
        if: steps.decide.outputs.published == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # `npm publish` leaves `latest` wherever the registry's tag logic puts it;
  # a higher withdrawn version can keep it. Assert it, set it if wrong, and
  # fail the job unless the registry then agrees, after re-applying the
  # withdrawn versions' deprecations. Runs whether or not this run published,
  # so a re-run repairs both. Pre-releases are not `latest`.
  latest:
    name: Assert dist-tag latest
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      # Re-apply the deprecations of the withdrawn versions (owner decision,
      # 2026-10-09), so a registry edit cannot quietly undo them. The list is
      # exact versions, never a range: a range such as <1.0.0 would also
      # deprecate every future 0.x release the moment it is published.
      - name: Keep the withdrawn versions deprecated
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          WITHDRAWN_MSG="withdrawn: mis-numbered build of the 0.2.4 line; install devcouncil@latest"
          SUPERSEDED_MSG="superseded by the 0.2.x line; install devcouncil@latest"
          # version|message, one per line
          WANT="1.3.5|${WITHDRAWN_MSG}
          0.3.0|${SUPERSEDED_MSG}
          0.3.1|${SUPERSEDED_MSG}
          0.4.0|${SUPERSEDED_MSG}
          0.4.1|${SUPERSEDED_MSG}
          0.4.2|${SUPERSEDED_MSG}"
          if printf '%s\n' "$WANT" | sed 's/^ *//' | cut -d'|' -f1 | grep -qxF "$VERSION"; then
            echo "::error::${VERSION} is a withdrawn version; it must not be released"
            exit 1
          fi
          npm ping
          bad=0
          while IFS='|' read -r v msg; do
            v="${v#"${v%%[! ]*}"}"
            npm deprecate "devcouncil@${v}" "$msg" </dev/null
            got="$(npm view "devcouncil@${v}" deprecated </dev/null)"
            if [ "$got" != "$msg" ]; then
              echo "::error::devcouncil@${v} deprecation is '${got:-unset}', expected '${msg}'"
              bad=1
            fi
          done <<< "$WANT"
          exit "$bad"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Point latest at the released version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            *-*) echo "::notice::${VERSION} is a pre-release; dist-tags.latest is not asserted"; exit 0;;
          esac
          npm ping
          VIEWED="$(npm view "devcouncil@${VERSION}" version)"
          if [ "$VIEWED" != "$VERSION" ]; then
            echo "::error::devcouncil@${VERSION} is not on the registry (npm view said: ${VIEWED:-nothing})"
            exit 1
          fi
          LATEST="$(npm view devcouncil dist-tags.latest)"
          if [ "$LATEST" != "$VERSION" ]; then
            echo "::warning::dist-tags.latest is ${LATEST:-unset}, not ${VERSION}; moving it"
            npm dist-tag add "devcouncil@${VERSION}" latest
          fi
          # The registry can lag a tag write; poll before calling it a failure.
          for attempt in 1 2 3 4 5 6; do
            LATEST="$(npm view devcouncil dist-tags.latest)"
            [ "$LATEST" = "$VERSION" ] && { echo "dist-tags.latest = ${VERSION}"; exit 0; }
            sleep $((attempt * 5))
          done
          echo "::error::dist-tags.latest is ${LATEST:-unset} after the update, expected ${VERSION}"
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  smoke:
    name: Registry smoke
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && needs.publish.outputs.published == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      # The npm package is only a launcher; with no host on the runner the
      # smoke reports NOT RUN and fails. Build the host from this tag's
      # checkout (the only install route) so the published launcher has a
      # real binary to reach.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go_orchestrator/go.mod
          cache-dependency-path: backend/go_orchestrator/go.mod
      - name: Set up Gusset
        uses: ./.github/actions/setup-gusset
      - name: Build the host the launcher will reach
        run: |
          set -euo pipefail
          HOST_DIR="${RUNNER_TEMP}/devcouncil-host"
          mkdir -p "$HOST_DIR"
          go -C backend/go_orchestrator build -o "$HOST_DIR/devcouncil" ./cmd/devcouncil
          "$HOST_DIR/devcouncil" version
          echo "$HOST_DIR" >> "$GITHUB_PATH"
      - name: Registry smoke (required after a new publish)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          export NPM_REGISTRY_SMOKE_VERSION="$VERSION"
          export NPM_REGISTRY_SMOKE_TIMEOUT=600
          npm run smoke:registry
