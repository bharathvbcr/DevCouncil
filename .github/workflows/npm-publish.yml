name: npm Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run checks
        run: |
          set +e
          uv run --python 3.12 ruff check . 2>&1 | tee ruff.log
          ruff_status=${PIPESTATUS[0]}
          uv run --python 3.12 mypy src 2>&1 | tee mypy.log
          mypy_status=${PIPESTATUS[0]}
          uv run --python 3.12 pytest 2>&1 | tee pytest.log
          pytest_status=${PIPESTATUS[0]}
          if [ "$ruff_status" -ne 0 ] || [ "$mypy_status" -ne 0 ] || [ "$pytest_status" -ne 0 ]; then
            {
              echo "### ruff tail"
              echo '```'
              tail -n 80 ruff.log
              echo '```'
              echo "### mypy tail"
              echo '```'
              tail -n 120 mypy.log
              echo '```'
              echo "### pytest tail"
              echo '```'
              tail -n 160 pytest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            combined="$(tail -n 30 ruff.log; tail -n 60 mypy.log; tail -n 60 pytest.log)"
            msg=$(printf "%s" "$combined" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=release checks failed::$msg"
            if [ "$ruff_status" -ne 0 ]; then
              exit "$ruff_status"
            fi
            if [ "$mypy_status" -ne 0 ]; then
              exit "$mypy_status"
            fi
            exit "$pytest_status"
          fi

      - name: Check npm package contents
        run: |
          npm run pack:check
          npm run smoke:wheel
          npm run smoke:package

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Publish package
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: Registry smoke + GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Derive package version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Registry smoke (required before release complete)
        env:
          NPM_REGISTRY_SMOKE_VERSION: ${{ steps.ver.outputs.version }}
          NPM_REGISTRY_SMOKE_TIMEOUT: "600"
        run: npm run smoke:registry
      - name: Create GitHub Release with judge notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          NOTES_FILE="docs/judge-release-notes.md"
          BODY_FILE="$(mktemp)"
          {
            echo "## DevCouncil ${TAG}"
            echo
            echo "npm package: ${VERSION}"
            echo
            echo "Registry smoke passed before this release was marked complete."
            echo
            cat "$NOTES_FILE"
          } > "$BODY_FILE"
          gh release create "$TAG" --title "DevCouncil ${TAG}" --notes-file "$BODY_FILE" "$NOTES_FILE"
