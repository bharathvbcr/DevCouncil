name: npm Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Release identity
        run: npm run check:release

      - name: Check npm package contents
        run: |
          npm run pack:check
          npm run smoke:package

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      published: ${{ steps.decide.outputs.published }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Decide whether this version is new
        id: decide
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::tag ${TAG} does not match package.json ${VERSION}"
            exit 1
          fi
          # A registry that cannot be reached must not look like "unpublished".
          npm ping
          VIEWED="$(npm view "devcouncil@${VERSION}" version 2>/dev/null || true)"
          if [ "$VIEWED" = "$VERSION" ]; then
            echo "devcouncil@${VERSION} is already on the npm registry; skipping publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$VIEWED" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::unexpected npm view output for devcouncil@${VERSION}: ${VIEWED}"
            exit 1
          fi

      - name: Publish package
        if: steps.decide.outputs.published == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  smoke:
    name: Registry smoke
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && needs.publish.outputs.published == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Registry smoke (required after a new publish)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          export NPM_REGISTRY_SMOKE_VERSION="$VERSION"
          export NPM_REGISTRY_SMOKE_TIMEOUT=600
          npm run smoke:registry
