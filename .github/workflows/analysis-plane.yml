name: analysis components (rust/ + go clients)

# The dc-* components and their Go clients. `rust.yml` covers the devmap
# kernel. This job tests only the analysis-plane packages so a dc-grep change
# does not compile thirty tree-sitter grammars.
#
# Two jobs, because they fail for different reasons:
#
#   rust — the dc-* components themselves, on three platforms.
#   go   — the clients, driving real component binaries rather than fakes.
#
# The Python package and its TaskLeaseRepository jobs are gone. dc-store's
# interop test records that retirement; it does not look for a virtualenv.
#
# `dc-verify`'s json_contract does not skip. It drives the Go host binary as a
# real process — the only way to tell a banner on stdout from one on stderr —
# and fails when that binary is absent, so the rust job builds it. It named the
# deleted Python CLI until 2026-09-14 and skipped its way to green for four
# days; the build step below is what keeps that from recurring silently.

on:
  push:
    paths:
      - "rust/**"
      - "backend/go_orchestrator/**"
      # policy's contract tests read these, including the CHECKSUMS check
      # that fails when a contract changes without its manifest.
      - "backend/contracts/**"
      - ".github/workflows/analysis-plane.yml"
      - ".github/actions/setup-gusset/**"
      - ".github/actions/setup-rust/**"
      - "rust-toolchain.toml"
  pull_request:
    paths:
      - "rust/**"
      - "backend/go_orchestrator/**"
      # policy's contract tests read these, including the CHECKSUMS check
      # that fails when a contract changes without its manifest.
      - "backend/contracts/**"
      - ".github/workflows/analysis-plane.yml"
      - ".github/actions/setup-gusset/**"
      - ".github/actions/setup-rust/**"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

# One run per workflow and ref: a newer push supersedes the one in flight.
# Tag refs are never cancelled, so a release cannot be cut off by a later push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  rust:
    name: components (${{ matrix.os }})
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: rust

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked -p dc-glob -p dc-proc -p dc-redact -p dc-grep -p dc-store -p dc-verify -p dc-evidence --all-targets -- -D warnings

      # dc-store compiles SQLite from source (rusqlite "bundled"), so a failure
      # here is a C toolchain or portability problem rather than a test problem.
      # Windows is in the matrix because dc-grep carries cfg(not(unix)) fallbacks
      # for O_NOFOLLOW and path separators that nothing else exercises; three of
      # the four crates were confirmed to compile for the MSVC target locally,
      # and dc-store's C build could not be cross-checked from macOS — this job
      # is where that answer comes from.
      #
      # Packages are named rather than `--workspace` so this job does not
      # compile the kernel's tree-sitter grammars. It still compiles four:
      # dc-verify's stub detection links the Rust, Go, Python and TypeScript
      # grammars unconditionally.
      - name: Build
        run: cargo build --locked -p dc-glob -p dc-proc -p dc-redact -p dc-grep -p dc-store -p dc-verify -p dc-evidence --all-targets

      # dc-verify's json_contract runs the host's `--json` commands as real
      # processes and fails if it cannot find the binary. The module's only
      # dependency is the Gusset sibling plus the umbrella staticlib; building
      # those does not compile a tree-sitter grammar.
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go_orchestrator/go.mod
          cache-dependency-path: backend/go_orchestrator/go.mod
      - name: Set up Gusset
        uses: ./.github/actions/setup-gusset
      - name: Build the DevCouncil host
        working-directory: backend/go_orchestrator
        run: go build -o bin/ ./cmd/devcouncil

      - name: Test
        run: cargo test --locked -p dc-glob -p dc-proc -p dc-redact -p dc-grep -p dc-store -p dc-verify -p dc-evidence --no-fail-fast

  go:
    name: clients (${{ matrix.os }})
    timeout-minutes: 120
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go_orchestrator/go.mod
          cache-dependency-path: backend/go_orchestrator/go.mod
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: rust
          # devmap is built below from its own workspace; cache both so the
          # tree-sitter grammars are not recompiled on every run.
          cache-all-crates: true

      # testsupport builds dcstore, dcverify and dcgrep out of rust/ and the
      # tests exec them, so this job needs a Rust toolchain even though nothing
      # here is Rust. A C compiler comes with both runner images.
      #
      # sqlite3 is not optional: the requirements suite plants a task row with
      # it, and testsupport.Unavailable *fails* by default rather than skipping,
      # which is the intended behaviour and would take the job red without this.
      - name: Install sqlite3 and Linux bubblewrap sandbox
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y sqlite3 bubblewrap
            if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] && \
               [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" != "0" ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
            fi
            bwrap --ro-bind / / --dev /dev --proc /proc --unshare-user --unshare-pid -- /bin/true
            echo "REQUIRE_BWRAP_SANDBOX=1" >> "$GITHUB_ENV"
          else
            sqlite3 --version
          fi

      # dc/devmap's TestTheLive* tests drive the real devmap binary and skip
      # when it is absent. A skip is visible but the job still goes green, and
      # devmap lives in this repository — so a devmap change could break its own
      # Go client here with nothing to notice. Building it makes those three
      # tests actually run, which is why rust/** is in this workflow's
      # trigger paths.
      - name: Build devmap
        working-directory: rust
        run: cargo build --locked -p devmap-cli --bin devmap

      - name: Put devmap on PATH
        run: echo "$GITHUB_WORKSPACE/rust/target/debug" >> "$GITHUB_PATH"

      - name: Formatting
        working-directory: backend/go_orchestrator
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"; echo "$unformatted"; exit 1
          fi

      - name: Set up Gusset
        uses: ./.github/actions/setup-gusset

      - name: Vet
        working-directory: backend/go_orchestrator
        run: go vet ./...

      - name: Test
        working-directory: backend/go_orchestrator
        run: go test ./... -count=1

      # The golden corpus is the regression record for the Go host's get_diff
      # results, embedded skills and tool list. The driver is a plain program,
      # not a test, so nothing ran it and it rotted (it asserted 17 skills for
      # the commits after the library had 18). Its exit status is the gate.
      - name: Golden replay
        working-directory: backend/go_orchestrator
        run: go run ./cmd/devcouncil-golden-replay

      # A separate step, not a flag on the one above, so the fast signal still
      # arrives first and a race is attributed to the race detector rather than
      # read as a flaky test.
      #
      # This gate is not speculative. The concurrency work on 2026-09-05 landed
      # a data race in `Provenance()` — one reader's caller could rewrite the
      # next reader's provenance through an aliased pointer — and `go test`
      # was green on it. `-race` was the only thing that saw it.
      - name: Race detector
        working-directory: backend/go_orchestrator
        run: go test ./... -count=1 -race

      # Known vulnerabilities in the module graph this host builds with. The
      # tool is installed at a pinned version, not `latest`.
      - name: Vulnerability scan
        working-directory: backend/go_orchestrator
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...

      # The live-contract tests are the only check that the field names this
      # module decodes are the ones devmap emits. If they skipped, the step
      # above was green without ever having spoken to the producer, so the skip
      # is turned into a failure here rather than left in the log.
      - name: Live devmap contract must have run
        working-directory: backend/go_orchestrator
        run: |
          out="$(go test ./dc/devmap/ -count=1 -run TestTheLive -v 2>&1)"
          echo "$out"
          if echo "$out" | grep -q -- '--- SKIP'; then
            echo "::error::the live devmap contract tests skipped; the producer was never driven"
            exit 1
          fi
          echo "$out" | grep -q -- '--- PASS: TestTheLiveContractHolds' || {
            echo "::error::TestTheLiveContractHolds did not run"; exit 1; }

      # The flag table and the state-dir port also drive the real devmap.
      # testsupport.Devmap fails when the binary cannot be built, and skips
      # only when DEVCOUNCIL_TEST_ALLOW_SKIP=1. A skip there is the same hole
      # as a skipped TestTheLive*: the job would be green without having
      # spoken to the producer. Name both tests, and fail if either skips.
      - name: Flag and state-dir contracts must have run
        working-directory: backend/go_orchestrator
        run: |
          set +e
          out="$(go test ./cmd/devcouncil/ ./repomap/ -count=1 -run '^(TestDevmapGlobalFlagTablesMatchTheRealBinary|TestStateDirAgreesWithDevmapOnEveryRung)$' -v 2>&1)"
          status="$?"
          set -e
          echo "$out"
          if [ "$status" -ne 0 ]; then
            echo "::error::flag-table or state-dir contract failed"
            exit 1
          fi
          if echo "$out" | grep -q -- '--- SKIP'; then
            echo "::error::flag-table or state-dir contract skipped; the producer was never driven"
            exit 1
          fi
          echo "$out" | grep -q -- '--- PASS: TestDevmapGlobalFlagTablesMatchTheRealBinary' || {
            echo "::error::TestDevmapGlobalFlagTablesMatchTheRealBinary did not run"; exit 1; }
          echo "$out" | grep -q -- '--- PASS: TestStateDirAgreesWithDevmapOnEveryRung' || {
            echo "::error::TestStateDirAgreesWithDevmapOnEveryRung did not run"; exit 1; }

      - name: Install pinned Lean 4 kernel and lean4checker (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ELAN_TAR="/tmp/elan-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz" -o "$ELAN_TAR"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $ELAN_TAR" | sha256sum -c -
          mkdir -p /tmp/elan-bin
          tar -xzf "$ELAN_TAR" -C /tmp/elan-bin
          /tmp/elan-bin/elan-init -y --default-toolchain leanprover/lean4:v4.16.0
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          LEAN4CHECKER_COMMIT="803320ef4a0948d44e56927b2d1c60c3e8c6e4e4"
          git init /tmp/lean4checker
          git -C /tmp/lean4checker remote add origin https://github.com/leanprover/lean4checker.git
          git -C /tmp/lean4checker fetch --depth 1 origin "$LEAN4CHECKER_COMMIT"
          git -C /tmp/lean4checker checkout --detach FETCH_HEAD
          test "$(git -C /tmp/lean4checker rev-parse HEAD)" = "$LEAN4CHECKER_COMMIT"
          (cd /tmp/lean4checker && lake build)
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "/tmp/lean4checker/.lake/build/bin" >> "$GITHUB_PATH"

      - name: Live Lean 4 kernel and lean4checker TCB gates (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          spec_dir="$(mktemp -d)"
          trap 'rm -rf "$spec_dir"' EXIT
          cat > "$spec_dir/SoundSpec.lean" <<'EOF'
          namespace SoundSpec
          theorem refl_nat (n : Nat) : n = n := rfl
          end SoundSpec
          EOF
          out="$(devmap --json --root "$spec_dir" lean-tcb --require-kernel)"
          echo "$out"
          grep -Eq '"verification_tier":[[:space:]]*"kernel_and_lean4checker"' <<<"$out"
          grep -Eq '"sound":[[:space:]]*true' <<<"$out"
          DC_VERIFY_LEAN_KERNEL=require cargo test --locked --manifest-path rust/Cargo.toml -p dc-verify --test lean_tcb

  # The Go host on Windows. Windows-only paths (quoted path handling in hook
  # cleanup, integrate writes, separators in reported paths) never ran in CI:
  # the `go` job above is Unix only. Gusset is Unix only, so on Windows the
  # sibling is checked out for go.mod's replace and the engine is not built;
  # gussetfn is build-tagged and answers ErrUnsupported there.
  go-windows:
    name: clients (windows-latest)
    timeout-minutes: 120
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go_orchestrator/go.mod
          cache-dependency-path: backend/go_orchestrator/go.mod
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: rust
      # testsupport builds dcstore, dcverify and dcgrep out of rust/ and the
      # tests exec them; the requirements suite also plants a row with sqlite3.
      - name: Install sqlite3
        shell: bash
        run: choco install sqlite --no-progress -y && sqlite3 --version
      - name: Build devmap
        working-directory: rust
        run: cargo build --locked -p devmap-cli --bin devmap
      - name: Put devmap on PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/rust/target/debug" >> "$GITHUB_PATH"
      - name: Set up Gusset
        uses: ./.github/actions/setup-gusset
      - name: Vet
        working-directory: backend/go_orchestrator
        run: go vet ./...
      - name: Test
        working-directory: backend/go_orchestrator
        run: go test ./... -count=1

  # Known advisories in the Cargo.lock the kernel and the dc-* crates ship with.
  supply-chain:
    name: cargo advisories
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
          command: check advisories
