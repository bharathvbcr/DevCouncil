name: Scorecard

# OpenSSF Scorecard supply-chain analysis of the default branch. Results go to
# code scanning only. Publishing to the Scorecard API (publish_results: true)
# needs id-token: write, and scripts/check-workflows.mjs allows that grant to the
# npm `publish` job alone, so results are not published and there is no badge.
# Follows the example in ossf/scorecard-action (examples/scorecard.yml).
on:
  # For the Branch-Protection check. Only the default branch is supported.
  branch_protection_rule:
  # Keeps the Maintained check updated.
  schedule:
    - cron: "23 5 * * 1"
  push:
    branches: ["main"]

# No workflow-wide token; the one job asks for what it uses. The example's
# top-level `cache-mode: none` is left out: scripts/check-workflows.mjs runs
# actionlint, and actionlint 1.7.12 rejects that key. Scorecard also forbids
# top-level env and defaults here, so none are set.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # Scorecard only supports the default branch.
    if: ${{ github.event.repository.default_branch == github.ref_name }}
    permissions:
      security-events: write # Upload SARIF to code scanning.
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
