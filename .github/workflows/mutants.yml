name: mutation testing

# cargo-mutants on the resolver and the analyzer, where a test that cannot fail
# costs the most. Two modes:
#
#   pull request: only mutants in the lines the PR changed (--in-diff), bounded
#                 by the job timeout. A timeout is a failure, never a pass.
#   weekly:       the full run, compared with rust/mutants-baseline.txt, the
#                 committed list of mutants the suite is known to miss. A missed
#                 mutant that is not in the baseline fails the job (a
#                 regression); a baseline entry that is now caught is reported
#                 so the baseline can shrink. The baseline is not zero yet, so
#                 the job is blocking only on regressions above it.
#
# There is no baseline until the first full run has produced one: the weekly
# job then FAILS with the instruction below rather than comparing against
# nothing, and uploads mutants.out so the missed list can be committed.

on:
  pull_request:
    paths:
      - "rust/devmap-resolve/**"
      - "rust/devmap-analyze/**"
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  in-diff:
    name: changed code
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: rust
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Mutate the changed lines
        working-directory: rust
        run: |
          set -euo pipefail
          git diff "origin/${{ github.base_ref }}...HEAD" -- devmap-resolve devmap-analyze > "$RUNNER_TEMP/pr.diff"
          if [ ! -s "$RUNNER_TEMP/pr.diff" ]; then
            echo "NOT RUN: the pull request changes no mutable line in devmap-resolve or devmap-analyze"
            exit 0
          fi
          cargo mutants -p devmap-resolve -p devmap-analyze --in-diff "$RUNNER_TEMP/pr.diff" --timeout 60

  weekly:
    name: full run against the baseline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: rust
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Run every mutant
        working-directory: rust
        run: cargo mutants -p devmap-resolve -p devmap-analyze --timeout 60 --no-shuffle || test $? -eq 2
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: mutants-out
          path: rust/mutants.out
          if-no-files-found: error
      - name: Compare the missed mutants with the baseline
        working-directory: rust
        run: |
          set -euo pipefail
          test -f mutants.out/missed.txt || { echo "::error::cargo-mutants wrote no missed.txt; the run did not complete"; exit 1; }
          if [ ! -f mutants-baseline.txt ]; then
            echo "::error::rust/mutants-baseline.txt is not committed. Download the mutants-out artifact and commit mutants.out/missed.txt as rust/mutants-baseline.txt."
            exit 1
          fi
          sort -u mutants.out/missed.txt > "$RUNNER_TEMP/now.txt"
          sort -u mutants-baseline.txt > "$RUNNER_TEMP/base.txt"
          regress="$(comm -13 "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/now.txt")"
          caught="$(comm -23 "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/now.txt")"
          if [ -n "$caught" ]; then
            echo "::notice::mutants in the baseline that are now caught (remove them from the baseline):"
            echo "$caught"
          fi
          if [ -n "$regress" ]; then
            echo "::error::missed mutants not in the baseline:"
            echo "$regress"
            exit 1
          fi
