name: devmap (Rust port)

# The Rust port had no CI of any kind: every gate ran only on a developer's
# macOS machine. That hid two classes of problem at once — platform-specific
# failures (Windows path separators, named pipes instead of Unix sockets) and
# the simple case of a change that never got `cargo test` run against it.
#
# `verify.sh` is a bash script that shells out to `sqlite3` and `rsync`, so the
# full gate runs on Unix only. Windows still runs the whole Rust test suite,
# which is what covers the platform-specific code paths.
#
# It must be invoked with bash, matching its `#!/usr/bin/env bash` shebang. This
# job previously ran it under zsh, where an unquoted parameter expansion is not
# word-split: `set -- $SIZES` made the five build sizes one word, `S3=$3` died
# under `set -u`, and gates 6 (growth plateau), 7 (incremental-vs-cold
# equivalence) and 8 never ran at all. The workflow is new and has never been
# pushed, so this was never a green build hiding a failure — but it would have
# been.

on:
  push:
    paths:
      - "rust-port/**"
      - ".github/workflows/rust-port.yml"
  pull_request:
    paths:
      - "rust-port/**"
      - ".github/workflows/rust-port.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: rust-port

# Bound nested executor fan-out on hosted runners. Individual stress tests still
# create their explicit 256 concurrent sessions; every test remains collected.
# The release performance gate uses the runner's available Rayon parallelism.
env:
  RUST_TEST_THREADS: "2"
  TOKIO_WORKER_THREADS: "2"

jobs:
  test:
    name: test (${{ matrix.os }})
    env:
      RAYON_NUM_THREADS: "2"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-port

      # Formatting and lints are platform-independent, so one run is enough —
      # but running them everywhere costs nothing and catches a cfg-gated block
      # that only compiles on one target.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --keep-going -- -D warnings

      # 22 tree-sitter grammars compile C. A build failure here is a real
      # portability failure, not a test failure, so it is a separate step.
      - name: Build
        if: ${{ !cancelled() }}
        run: cargo build --workspace --all-targets --keep-going

      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test --workspace --no-fail-fast

      - uses: actions/setup-python@v5
        if: ${{ !cancelled() }}
        with:
          python-version: "3.12"
      - name: Native worktree capacity and process recovery
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          python -m unittest discover -s tools -p test_worktree_stress.py
          python tools/worktree_stress.py --binary "target/debug/devmap$suffix" --ipc-probe "target/debug/examples/ipc_probe$suffix" --worktrees 2 --fixture-files 4 --rounds 1 --build-workers 2 --output capacity-smoke.json
          python tools/worktree_stress.py --binary "target/debug/devmap$suffix" --ipc-probe "target/debug/examples/ipc_probe$suffix" --worktrees 128 --fixture-files 64 --rounds 4 --build-workers 8 --output capacity-native.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: capacity-${{ matrix.os }}
          path: rust-port/capacity-*.json
          if-no-files-found: error

  # The shape an embedder links: this workspace's five parsing crates each
  # build without tree-sitter, answering questions about a persisted map
  # instead of building one. Nothing in CI had ever compiled that shape.
  #
  # It has now silently broken twice. Targets that import `#[cfg(feature =
  # "parse")]` items fail the whole target when the feature is off, and a
  # build error reads as "not meant to be tested" rather than as a failure,
  # so `required-features` gaps survive review. The second time, two targets
  # were added after the gating pass and simply never gated.
  #
  # This MUST stay per-crate. `cargo check --workspace --no-default-features`
  # passes while `cargo check -p devmap-query --no-default-features` fails:
  # `--no-default-features` turns off the workspace members' own defaults, but
  # devmap-cli and devmap-serve depend on devmap-query without
  # `default-features = false`, so unification switches `parse` back on for the
  # shared graph. The workspace-wide spelling is a check that cannot fail for
  # this class — it reports the same green as a check that actually ran.
  #
  # `cargo test` runs alongside `cargo check` on purpose: `required-features`
  # means "skip", so gating is coverage removed, and the tests that do survive
  # feature-off are the only ones proving that configuration works at all.
  feature-off:
    name: embedder shape (--no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-port
      - name: Per-crate feature-off build and test
        run: |
          set -euo pipefail
          for crate in devmap-extract devmap-resolve devmap-analyze devmap-store devmap-query; do
            echo "::group::$crate"
            cargo check -p "$crate" --no-default-features --all-targets
            cargo test -p "$crate" --no-default-features
            echo "::endgroup::"
          done

  gates:
    name: verify.sh gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-port
      - name: Install gate dependencies
        run: sudo apt-get update && sudo apt-get install -y sqlite3 rsync

      # Determinism, the measured memory ceiling, growth plateau, and the
      # incremental-vs-cold equivalence check that caught SC16.
      - name: Full gate suite
        run: bash ./verify.sh

  parity:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-port
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build release binary
        run: cargo build --release
