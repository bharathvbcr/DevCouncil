name: Labeler

# Labels pull requests from the paths they change, using .github/labeler.yml.
# pull_request_target runs with a write token even for fork pull requests, so
# this workflow never checks out or runs pull request code: the action reads the
# changed file list through the API and the config from the base branch.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label pull request
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Apply path labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
