name: selected tests (DevMap)

# Runs the tests `devmap blast` says this change reaches first, then the full
# suite, and records what it selected and what each suite showed
# (selection-recall.json, a record: the file keeps its name).
#
# This job orders and records; it does not measure recall. The selection is an
# ordering, never a gate: the full suite still runs and still decides the job.
# Every doubt widens the selection (backend/go_orchestrator/cmd/dctestselect,
# plan.go), up to running everything. The audit step reports loudly when a suite
# or the fast phase could not be examined, and says nothing about whether the
# selection was complete.
#
# A separate workflow rather than steps in rust.yml: rust.yml is edited by
# other lanes, and this one has to run on every push (almost every run here is
# a push), which rust.yml's `paths:` filter does not do. The cost is a second
# build of the workspace's tests on ubuntu.
#
# The universe is what rust.yml's Test step runs: the workspace less its
# `--exclude` list, plus every Go package. dctestselect owns that definition
# (DefaultRustExcludes, fullCommands), so the selection and the full suite
# cannot disagree about it.
#
# The selection is a crate, whole, together with every workspace member that
# depends on it, run as ONE `cargo test --locked -p <a> -p <b> ...`. Cargo
# unifies a package's features across the packages in the build set, so a crate
# built with all of its workspace dependents gets the feature set the full
# suite's `--workspace` gives it; built alone (`-p a`, or `--workspace
# --exclude b`) it would not. Cargo's `resolver.feature-unification =
# "workspace"` would make any set agree, but it is unstable on the pinned 1.99.0
# (it needs `-Z feature-unification`, nightly only; tracking issue
# rust-lang/cargo#14774), so it is not set. Go is the same shape: one
# `go test -json <pkgs...>` over the changed packages and the packages that
# import them. A failure only the fast phase has is recorded as
# `selected_phase_failed_only`.

on:
  push:
    # Branches only: a tag push is a release, which release.yml gates.
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per workflow and ref: a newer push supersedes the one in flight.
# Tag refs are never cancelled, so a release cannot be cut off by a later push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Bound nested executor fan-out on hosted runners, as rust.yml does.
env:
  RUST_TEST_THREADS: "2"
  TOKIO_WORKER_THREADS: "2"

jobs:
  selected:
    name: selected, then full (ubuntu)
    timeout-minutes: 120
    # upload-artifact uses the runner's own runtime token, not GITHUB_TOKEN, so
    # nothing here needs more than a checkout.
    permissions:
      contents: read
    env:
      RAYON_NUM_THREADS: "2"
      # Passed through the environment, never interpolated into a script.
      EVENT_BEFORE: ${{ github.event.before }}
      BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    steps:
      # The whole history, as mutants.yml does: the base is a merge base or the
      # commit before a push, and either may be arbitrarily far back.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go_orchestrator/go.mod
          cache-dependency-path: backend/go_orchestrator/go.mod
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: rust
          # Another cache entry per branch is cost with no reader.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # testsupport's tests need sqlite3 and fail, rather than skip, without it
      # (analysis-plane.yml installs it for the same reason).
      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      # go.mod replaces Gusset with a sibling checkout the host links. The
      # selector does not import it; the full Go suite does.
      - name: Set up Gusset
        uses: ./.github/actions/setup-gusset

      # devmap indexes this commit and answers the blast; the Go tests that
      # drive it (dc/devmap's live contract, the flag tables) run it from PATH.
      # Not fatal: without devmap there is no blast, which the plan reads as an
      # error and answers by running everything. The full suite and the
      # artifact must not depend on this step.
      - name: Build devmap
        continue-on-error: true
        working-directory: rust
        run: cargo build --locked -p devmap-cli --bin devmap

      - name: Put devmap on PATH
        run: echo "$GITHUB_WORKSPACE/rust/target/debug" >> "$GITHUB_PATH"

      # Fatal: nothing else here can run the full suite without it. The steps
      # after it are gated on its outcome and say so, instead of failing with a
      # bare exit 127 for a binary that does not exist. The job stays red.
      - name: Build the selector
        id: selector
        working-directory: backend/go_orchestrator
        run: go build -o "$RUNNER_TEMP/dctestselect" ./cmd/dctestselect

      - name: Selector build gate
        if: ${{ !cancelled() && steps.selector.outcome != 'success' }}
        run: |
          echo "::error::selector build failed; full suite not run"
          exit 1

      # A cold index, on the debug binary: no store is cached and `devmap seed`
      # is not relied on. The elapsed time is logged so the cost is a number.
      # Not fatal, for the reason above.
      - name: Index this commit
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -uo pipefail
          start="$(date +%s)"
          if ! devmap build; then
            echo "::warning::devmap build failed; the plan will run everything"
            exit 1
          fi
          echo "::notice::devmap build took $(( $(date +%s) - start )) s (debug binary, cold store)"

      # Whatever happened above: a missing devmap is a blast error, which runs
      # everything.
      - name: Plan the selection
        if: ${{ !cancelled() && steps.selector.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          mkdir -p "$RUNNER_TEMP/selection"
          "$RUNNER_TEMP/dctestselect" plan --repo . --devmap "$GITHUB_WORKSPACE/rust/target/debug/devmap" \
            --event "$GITHUB_EVENT_NAME" --ref-name "$GITHUB_REF_NAME" --before "$EVENT_BEFORE" \
            --base-ref "$BASE_BRANCH" --trigger "$GITHUB_EVENT_NAME" --timeout 5m --out "$RUNNER_TEMP/selection/plan.json"

      # The fast signal: only the crates and packages the plan names are built and run.
      - name: Selected tests
        if: ${{ steps.selector.outcome == 'success' }}
        run: |
          "$RUNNER_TEMP/dctestselect" run --repo . --plan "$RUNNER_TEMP/selection/plan.json" --phase selected \
            --log-dir "$RUNNER_TEMP/selection"

      # Still the gate. --no-fail-fast, so every failure is in the log. With no
      # usable plan it runs the built-in full suite and says so.
      - name: Full suite
        if: ${{ !cancelled() && steps.selector.outcome == 'success' }}
        run: |
          "$RUNNER_TEMP/dctestselect" run --repo . --plan "$RUNNER_TEMP/selection/plan.json" --phase full \
            --log-dir "$RUNNER_TEMP/selection"

      # continue-on-error until main is green (ft-7cb2d308). It exits 2 and
      # annotates when the plan, a suite or the fast phase could not be
      # examined; it is not a verdict on the selection. The artifact below is
      # still written.
      - name: Audit the selection against the full suite
        if: ${{ !cancelled() && steps.selector.outcome == 'success' }}
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/dctestselect" audit --plan "$RUNNER_TEMP/selection/plan.json" \
            --log-dir "$RUNNER_TEMP/selection" \
            --sha "$GITHUB_SHA" --ref "$GITHUB_REF" --event "$GITHUB_EVENT_NAME" --run-id "$GITHUB_RUN_ID" \
            --out "$RUNNER_TEMP/selection/selection-recall.json"

      # The selector's own end-to-end tests: a real devmap, cargo and go over
      # temp repositories. Behind the e2e tag so analysis-plane's `go test ./...`
      # on three platforms and under -race does not compile them.
      - name: Selector end-to-end
        if: ${{ !cancelled() }}
        working-directory: backend/go_orchestrator
        run: go test -tags e2e ./cmd/dctestselect -run '^TestE2E' -count=1 -p 1 -timeout 30m

      - name: Upload selection-recall.json
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: selection-recall
          path: |
            ${{ runner.temp }}/selection/selection-recall.json
            ${{ runner.temp }}/selection/plan.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload the full suite's logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: selection-logs
          path: |
            ${{ runner.temp }}/selection/*.log
            ${{ runner.temp }}/selection/*.jsonl
            ${{ runner.temp }}/selection/*-status.json
          if-no-files-found: warn
          retention-days: 7
