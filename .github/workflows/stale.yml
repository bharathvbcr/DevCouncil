name: Stale

# Marks issues and pull requests with no activity for 60 days, and closes them
# 14 days later if nothing changes. Security, pinned and contributor-welcome
# items are exempt.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  stale:
    name: Mark stale items
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Mark and close stale items
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has had no activity for 60 days, so it is marked stale. It
            will be closed in 14 days unless there is new activity. Comment to
            keep it open.
          stale-pr-message: >
            This pull request has had no activity for 60 days, so it is marked
            stale. It will be closed in 14 days unless there is new activity.
            Comment or push to keep it open.
          close-issue-message: >
            Closed for inactivity. Reopen it, or open a new issue, if it is still
            relevant.
          close-pr-message: >
            Closed for inactivity. Reopen it, or open a new pull request, if you
            want to continue.
          exempt-issue-labels: "security,pinned,good first issue,help wanted"
          exempt-pr-labels: "security,pinned"
          operations-per-run: 100
