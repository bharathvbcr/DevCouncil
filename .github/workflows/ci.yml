name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go_orchestrator/go.mod
          cache-dependency-path: backend/go_orchestrator/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Script tests
        run: npm run test:scripts

      - name: Release identity
        run: npm run check:release

      - name: Workflow lint
        run: npm run check:workflows

      - name: Go host binary
        working-directory: backend/go_orchestrator
        run: |
          gofmt -l cmd/devcouncil
          test -z "$(gofmt -l cmd/devcouncil)"
          go test ./cmd/devcouncil -count=1

      # tests/unit/ holds two harness tests for rust/tools/soak.sh. They slice
      # blocks out of the script and run them, so they only prove anything when
      # something runs them — an earlier orphan in that directory imported a
      # package deleted in 3286db5 and went unnoticed for months because no
      # workflow collected it. See tests/unit/README.md.
      #
      # The three prerequisites are checked rather than assumed: a soak test
      # that silently skips reports the same result as one that passed.
      - name: Soak harness tests
        run: |
          set -euo pipefail
          for tool in bash perl; do
            command -v "$tool" || { echo "::error::$tool is required by rust/tools/soak.sh"; exit 1; }
          done
          test -x /usr/bin/time || { echo "::error::/usr/bin/time is required by rust/tools/soak.sh; install the 'time' package"; exit 1; }
          python3 tests/unit/test_soak_query_check.py
          python3 tests/unit/test_soak_shutdown.py

      - name: Package smoke
        run: |
          npm pack --dry-run
          npm run smoke:package
