name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go_orchestrator/go.mod
          cache-dependency-path: backend/go_orchestrator/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Script tests
        run: npm run test:scripts

      - name: Release identity
        run: npm run check:release

      - name: Workflow lint
        run: npm run check:workflows

      - name: Go host binary
        working-directory: backend/go_orchestrator
        run: |
          gofmt -l cmd/devcouncil
          test -z "$(gofmt -l cmd/devcouncil)"
          go test ./cmd/devcouncil -count=1

      - name: Package smoke
        run: |
          npm pack --dry-run
          npm run smoke:package
