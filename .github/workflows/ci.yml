name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Run by hand on a branch, so a fix is verified before its PR exists.
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# One run per workflow and ref: a newer push supersedes the one in flight.
# Tag refs are never cancelled, so a release cannot be cut off by a later push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go_orchestrator/go.mod
          cache-dependency-path: backend/go_orchestrator/go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # The page shell for `devmap html` / `devmap map-html` is TypeScript built
      # by Bun into one checked-in bundle. Bun is pinned by `.bun-version` (a
      # different Bun can emit different bytes), and `check:code-map` fails when
      # the committed bundle is not what that Bun builds from the sources.
      # Bun does not type-check; GitPulse's tsc over its vendored copy does.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Code map bundle
        run: |
          npm run check:code-map
          npm run test:code-map

      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Script tests
        run: npm run test:scripts

      - name: Release identity
        run: |
          set -euo pipefail
          npm run test:release
          npm run check:release

      - name: Workflow lint
        run: npm run check:workflows

      # go.mod replaces Gusset with a sibling checkout, and the host links
      # rust/gusset-engine/target/release/libgusset.a. Neither is in this repo.
      - name: Set up Gusset
        uses: ./.github/actions/setup-gusset

      - name: Go host binary
        working-directory: backend/go_orchestrator
        run: |
          gofmt -l cmd/devcouncil
          test -z "$(gofmt -l cmd/devcouncil)"
          go test ./cmd/devcouncil -count=1

      # benchmarks/plots is its own Go module with its own tests; no other
      # workflow ran them.
      - name: Benchmark plots tests
        working-directory: benchmarks/plots
        run: go test ./... -count=1

      # tools/accuracy is its own Go module (the go/types labeller behind the
      # DevMap corpus record); its golden test keeps
      # rust/testdata/accuracy/go.labels.json equal to the labeller's output.
      - name: Accuracy labeller tests
        working-directory: tools/accuracy
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./... -count=1

      - name: Package smoke
        run: |
          npm pack --dry-run
          npm run smoke:package
