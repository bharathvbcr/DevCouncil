name: Bug Report
description: Something in DevCouncil behaves incorrectly.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        **Before filing:** please search [existing issues](https://github.com/bharathvbcr/DevCouncil/issues?q=is%3Aissue) first.

        **Do not report security vulnerabilities here.** Use the
        [private advisory form](https://github.com/bharathvbcr/DevCouncil/security/advisories/new)
        described in [SECURITY.md](https://github.com/bharathvbcr/DevCouncil/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you observe, and what did you expect instead?
      placeholder: |
        Expected: `devmap impact Foo` lists the callers of Foo.
        Actual: it returns an empty list, with `walk_incomplete` unset.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        Exact commands, starting from a clean checkout where you can. A bug we cannot
        reproduce is a bug we cannot fix. If the language or repository shape matters,
        say so.
      placeholder: |
        1. `devmap build --manifest` in a Go module with 3 packages
        2. `devmap status --json`
        3. `devmap impact Foo --json`
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Which component?
      options:
        - devmap (code intelligence and graph)
        - dcstore (task, lease and workbench store)
        - dcverify (verification and evidence)
        - dcgrep (search)
        - devcouncil / dev (Go host, MCP server, installer)
        - npm launcher package
        - Workflows / CI
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `devmap --version` (or the same flag on the binary you ran), or the release you installed.
      placeholder: "0.2.5"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Linux (x86_64)
        - Linux (aarch64)
        - Other
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Output and logs
      description: |
        Paste the relevant command output, and `devmap status --json` for a DevMap
        problem. **Review it before pasting:** it can contain repository paths. Remove
        anything that looks like a credential.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
