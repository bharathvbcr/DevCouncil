[project]
name = "fxpkg"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["click>=8", "fastapi>=0.110", "pydantic>=2", "numpy>=1.26", "polars>=1.0"]

[project.scripts]
fx = "pkg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib/pkg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lib"]
