[package]
name = "dc-verify"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Deterministic verifier core: diff parsing and planned-scope classification"

[dependencies]
dc-glob = { path = "../dc-glob" }
dc-proc = { path = "../dc-proc" }
dc-evidence = { path = "../dc-evidence" }
# The credential table the secret gate and every evidence field share. Its own
# crate so a consumer that only redacts — GitPulse's ledger — need not compile
# the tree-sitter below.
dc-redact = { path = "../dc-redact" }
serde_json = "1.0.151"
# AST-aware stub and test-rigor detection (src/stub_ast.rs). The same grammar
# versions devmap-extract already builds, from the workspace table; enabled
# unconditionally, so there is no feature-off shape to rot.
tree-sitter = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-typescript = { workspace = true }
# Java and C#: placeholders and empty bodies only; no test-rigor checks.
tree-sitter-java = { workspace = true }
tree-sitter-c-sharp = { workspace = true }

[lints]
workspace = true

# Installed by scripts/install.sh. Disting this package would also ship
# the dcjsoncheck helper binary on every GitHub Release.
[package.metadata.dist]
dist = false
