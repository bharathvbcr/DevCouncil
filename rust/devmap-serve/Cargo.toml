[package]
name = "devmap-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "IPC daemon and MCP HTTP transport for the DevCouncil code-intelligence kernel"

[dependencies]
devmap-extract = { path = "../devmap-extract" }
devmap-resolve = { path = "../devmap-resolve" }
devmap-analyze = { path = "../devmap-analyze" }
devmap-store = { path = "../devmap-store" }
devmap-query = { path = "../devmap-query" }
# The two git-joined directions. Both are served over IPC and MCP, so the
# daemon links the analysis and its store adapter — the same two crates the CLI
# links, rather than a second implementation that could disagree with it about
# the walk direction or the basis.
dc-regress = { path = "../dc-regress" }
dc-regress-store = { path = "../dc-regress-store" }
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
# The upgrade test has to age a stored generation's payload identity, which is
# what installing a new kernel over an old store does. There is no equivalent on
# the public Store API and adding a raw-SQL escape hatch to it purely for tests
# would be worse — the same reasoning devmap-cli records for its own dev use.
# Already a workspace dependency built for devmap-store, so no new crate enters
# the tree.
rusqlite.workspace = true
