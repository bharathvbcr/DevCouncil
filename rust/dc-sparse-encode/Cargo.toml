[workspace]

# A workspace of its own so the parent `cargo test --workspace` does not try
# to build tessl. tessl is Apple-silicon only; a Linux CI job that compiled
# this crate would fail before it ran a test.

[package]
name = "dc-sparse-encode"
version = "0.1.0"
edition = "2024"
rust-version = "1.99" # the pin in ../../rust-toolchain.toml
license = "Apache-2.0"
publish = false
description = "Offline doc-side sparse encoder for dcgrep, on tessl. Apple silicon only."

# An offline, Apple-silicon-only helper; a GitHub Release must not ship it.
[package.metadata.dist]
dist = false

# dc-grep stays inference-free. This crate is the only place a model is loaded,
# and it is not a member of the dc-grep workspace.
[dependencies]
dc-grep = { path = "../dc-grep" }
serde_json = "1"

# The BERT kernels (LayerNorm, erf-GELU, head-dim 32 attention, segment sparse
# max) and the safetensors loader live in tessl's src/bert.rs and
# src/safetensors.rs. Published tessl 0.2.0 has neither, so this pins a git
# revision that has both; it moves to a crates.io version when tessl 0.3.0 is
# published. Do not copy the kernels into this crate, and do not use a path
# dependency: no CI runner has a sibling tessl checkout.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
tessl = { git = "https://github.com/bharathvbcr/tessl", rev = "de4747a25d7edf22d3c3f44b1991b7ef7f446651" }

[lints.rust]
unsafe_code = "forbid"
