[package]
name = "devmap-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SQLite store and schema migrations for the DevCouncil code-intelligence kernel"

[dependencies]
devmap-extract = { path = "../devmap-extract", default-features = false }
devmap-resolve = { path = "../devmap-resolve", default-features = false }
devmap-analyze = { path = "../devmap-analyze", default-features = false }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
rayon.workspace = true

[dev-dependencies]
devmap-serve = { path = "../devmap-serve" }

[features]
default = ["parse"]
# Forwards the parsing frontend. Off, this crate builds without tree-sitter
# and answers questions about a persisted map rather than building one.
parse = ["devmap-extract/parse", "devmap-resolve/parse", "devmap-analyze/parse"]
