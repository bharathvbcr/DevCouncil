[package]
name = "dc-store"
version.workspace = true
edition = "2024"
license.workspace = true
description = "DevCouncil state store: tasks and the lease that makes concurrent building safe"

[dependencies]
# "bundled" compiles SQLite from source, which keeps the store independent of
# whatever libsqlite3 the host has. Pinned with the kernel at workspace level
# so this crate and `devmap-store` do not carry two SQLite builds.
rusqlite.workspace = true

[lints]
workspace = true

# Installed by scripts/install.sh. cargo-dist would otherwise announce this
# package beside the CLI and a Windows tgrep-core failure could take the
# whole GitHub Release with it.
[package.metadata.dist]
dist = false
