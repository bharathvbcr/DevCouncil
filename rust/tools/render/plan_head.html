<title>dev map → Rust: Clean-Room Rewrite Plan</title>
<style>
  :root {
    --ground: #F5F7F9; --surface: #FFFFFF; --surface-sunk: #EDF0F4;
    --border: #DCE1E8; --border-strong: #C3CBD6;
    --ink: #12161D; --ink-muted: #58616F; --ink-faint: #808A99;
    --accent: #A85C26; --accent-soft: #F0E2D6;
    --critical: #A82920; --critical-soft: #F6E0DE;
    --warn: #7D5200; --warn-soft: #F6EBD5;
    --info: #2A5680; --info-soft: #DEE8F1;

  }

    :root:not([data-theme="light"]) {
      --ground: #0E1116; --surface: #161A21; --surface-sunk: #11151B;
      --border: #262C36; --border-strong: #38414F;
      --ink: #E3E8EF; --ink-muted: #98A2B1; --ink-faint: #6E7887;
      --accent: #D9884A; --accent-soft: #33241A;
      --critical: #EE7065; --critical-soft: #331C1A;
      --warn: #DCA347; --warn-soft: #2E2415;
      --info: #79ACDA; --info-soft: #17242F;
      --ok: #6FBB92; --ok-soft: #16271E;
      --code-bg: #10141A;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0E1116; --surface: #161A21; --surface-sunk: #11151B;
    --border: #262C36; --border-strong: #38414F;
    --ink: #E3E8EF; --ink-muted: #98A2B1; --ink-faint: #6E7887;
    --accent: #D9884A; --accent-soft: #33241A;
    --critical: #EE7065; --critical-soft: #331C1A;
    --warn: #DCA347; --warn-soft: #2E2415;
    --info: #79ACDA; --info-soft: #17242F;
    --ok: #6FBB92; --ok-soft: #16271E;
    --code-bg: #10141A;
  }

  * { box-sizing: border-box; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.62; margin: 0; padding: 0 20px 96px; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 54px; }
  .prose { max-width: 68ch; display: flex; flex-direction: column; gap: 14px; }
  p { margin: 0; }
  a { color: var(--accent); }

  header.masthead { padding: 64px 0 0; display: flex; flex-direction: column; gap: 22px; }
  .eyebrow { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-faint); margin: 0; }
  h1 { font-family: var(--mono); font-size: clamp(28px, 4.4vw, 42px); font-weight: 600; letter-spacing: -0.02em; line-height: 1.12; margin: 0; text-wrap: balance; }
  h1 .arrow { color: var(--accent); font-weight: 400; }
  .standfirst { font-size: 18px; color: var(--ink-muted); max-width: 64ch; margin: 0; }

  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 3px; overflow: hidden; }
  .metric { background: var(--surface); padding: 16px 18px; display: flex; flex-direction: column; gap: 3px; }
  .metric .v { font-family: var(--mono); font-size: 23px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1.15; }
  .metric .k { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); }
  .metric.is-bad .v { color: var(--critical); }
  .metric.is-warn .v { color: var(--warn); }
  .metric.is-ok .v { color: var(--ok); }

  section { display: flex; flex-direction: column; gap: 20px; }
  .sec-head { display: flex; flex-direction: column; gap: 6px; border-top: 2px solid var(--ink); padding-top: 14px; }
  h2 { font-family: var(--mono); font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
  .sec-num { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.14em; color: var(--accent); text-transform: uppercase; }
  h3 { font-family: var(--mono); font-size: 14.5px; font-weight: 600; letter-spacing: 0.01em; margin: 0; color: var(--ink); }

  .scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 3px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  thead th { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); font-weight: 500; background: var(--surface-sunk); white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  tfoot td { font-weight: 600; background: var(--surface-sunk); font-family: var(--mono); font-variant-numeric: tabular-nums; }
  code, .path { font-family: var(--mono); font-size: 0.9em; background: var(--surface-sunk); padding: 1px 5px; border-radius: 2px; border: 1px solid var(--border); white-space: nowrap; }
  td code, td .path { background: none; border: none; padding: 0; }
  .id { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--ink-faint); white-space: nowrap; }

  pre { margin: 0; background: var(--code-bg); border: 1px solid var(--border); border-radius: 3px; padding: 14px 16px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; color: var(--ink); }
  pre .c { color: var(--ink-faint); }
  pre .k { color: var(--accent); }
  .codecap { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); }
  .codeblock { display: flex; flex-direction: column; gap: 7px; }

  .ledger { display: flex; flex-direction: column; gap: 10px; }
  .finding { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--border-strong); border-radius: 3px; padding: 14px 18px; display: flex; flex-direction: column; gap: 7px; }
  .finding.sev-critical { border-left-color: var(--critical); }
  .finding.sev-high { border-left-color: var(--warn); }
  .finding.sev-medium { border-left-color: var(--info); }
  .finding.sev-note { border-left-color: var(--ink-faint); }
  .f-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; }
  .f-id { font-family: var(--mono); font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; color: var(--ink-faint); }
  .f-title { font-family: var(--mono); font-size: 14px; font-weight: 600; letter-spacing: -0.005em; flex: 1 1 240px; }
  .f-body { font-size: 14.5px; color: var(--ink-muted); }
  .f-body strong { color: var(--ink); font-weight: 600; }
  .f-ev { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .chip { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; padding: 2.5px 7px; border-radius: 2px; white-space: nowrap; font-weight: 600; }
  .chip.critical { background: var(--critical-soft); color: var(--critical); }
  .chip.high { background: var(--warn-soft); color: var(--warn); }
  .chip.medium { background: var(--info-soft); color: var(--info); }
  .chip.note { background: var(--surface-sunk); color: var(--ink-faint); }
  .chip.spec { background: var(--ok-soft); color: var(--ok); }

  .callout { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 3px; padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; }
  .callout h3 { color: var(--accent); }
  .callout p { font-size: 14.5px; color: var(--ink-muted); max-width: 66ch; }

  .phases { display: flex; flex-direction: column; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 3px; overflow: hidden; }
  .phase { background: var(--surface); padding: 18px 20px; display: grid; grid-template-columns: 62px 1fr; gap: 4px 18px; }
  .phase .p-num { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; color: var(--accent); text-transform: uppercase; padding-top: 3px; }
  .phase .p-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; }
  .phase h3 { flex: 1 1 auto; }
  .p-est { font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

  .phase p { font-size: 14.5px; color: var(--ink-muted); max-width: 68ch; }
  .gate { font-family: var(--mono); font-size: 12px; color: var(--ink); background: var(--surface-sunk); border: 1px solid var(--border); border-radius: 2px; padding: 7px 11px; }
  .gate b { color: var(--accent); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; font-size: 10.5px; }
  ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; font-size: 14.5px; color: var(--ink-muted); }
  li strong { color: var(--ink); font-weight: 600; }

  .step { background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  .step-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }

  .fixes { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }

  footer { border-top: 1px solid var(--border); padding-top: 18px; font-family: var(--mono); font-size: 12px; color: var(--ink-faint); display: flex; flex-direction: column; gap: 5px; }
  @media (max-width: 620px) { .phase { grid-template-columns: 1fr; } .phase .p-body { grid-column: 1; } }
</style>
