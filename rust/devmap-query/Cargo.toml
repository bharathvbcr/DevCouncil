[package]
name = "devmap-query"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Query engine and code-graph artifact writers for the DevCouncil kernel"
autotests = false

[[test]]
name = "it"

[[test]]
name = "artifact_writer_security"

[[test]]
name = "a_cold_query_pays_for_its_answer_not_the_generation"
required-features = ["parse"]

[[test]]
name = "a_delete_this_list_reads_for_its_answer"
required-features = ["parse"]

[[test]]
name = "a_fan_out_pays_for_its_index_once_per_direction"
required-features = ["parse"]

[[test]]
name = "query_work_is_bounded_by_the_answer"
required-features = ["parse"]

[dependencies]
devmap-extract = { path = "../devmap-extract", default-features = false }
devmap-resolve = { path = "../devmap-resolve", default-features = false }
devmap-analyze = { path = "../devmap-analyze", default-features = false }
devmap-store = { path = "../devmap-store", default-features = false }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
regex.workspace = true
# For `O_NONBLOCK` on the memo read: opening a fifo without it blocks in
# `open(2)` forever. Already a workspace dependency, linked by dc-grep and
# devmap-cli, so nothing new enters the tree.
libc.workspace = true

[dev-dependencies]
# `a_query_only_build_can_call_a_store_current` has to seed a generation with
# grammars off, where the store writes none, so it inserts the rows by SQL.
# Already a workspace dependency built for devmap-store, so no new crate enters
# the tree — the same reasoning devmap-serve records for its own dev use.
rusqlite.workspace = true

[features]
default = ["parse"]
# Forwards the parsing frontend. Off, this crate builds without tree-sitter
# and answers questions about a persisted map rather than building one.
parse = ["devmap-extract/parse", "devmap-resolve/parse", "devmap-analyze/parse", "devmap-store/parse"]

# Which targets need a grammar.
#
# `--no-default-features` is the shape an embedder links, and this crate's test
# suite did not compile in it: these targets import items that are
# `#[cfg(feature = "parse")]`, and one unresolved import fails a whole target,
# so `cargo test -p devmap-query --no-default-features` returned a build
# error instead of results. A build error reads as "not meant to be tested",
# which is how it survived — no test had ever run in that configuration.
#
# The integration tests are one target, `tests/it.rs`, whose modules are the
# files under `tests/`. A file that needs a grammar is declared
# `#[cfg(feature = "parse")]` there, which skips it when `parse` is off rather
# than failing the build; `every_test_target_declares_its_grammar_need` reads
# those lines.
#
# `workspace_registry_concurrency` is deliberately absent — it exercises the
# workspace registry, which needs no parser, and it must keep being compiled
# and run in the no-parse configuration. See the note below the list for the examples.

[[example]]
name = "answer_snapshot"
required-features = ["parse"]

# Examples are targets too, and `--all-targets` builds them. `query_bench`
# builds a store to measure against, so it needs the frontend for the same
# reason the tests above do. The other three examples compile without `parse`
# and are deliberately left ungated: `required-features` means "skip", and
# skipping a target that would have built is coverage quietly deleted.

[[example]]
name = "query_bench"
required-features = ["parse"]

# Builds its generations from extracted source.
