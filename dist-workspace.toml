# cargo-dist workspace root. The Cargo workspace itself lives under rust/;
# this file sits at the git root so `dist` (and the generated Release workflow)
# find a project without needing a checkout-relative `cd`.
[workspace]
members = ["cargo:./rust"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms matching the existing CI matrix. Windows is required: a
# failed MSVC grammar build must fail the release rather than ship a silently
# missing target.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# Where to host releases
hosting = "github"
# Checksums are published beside every archive (sha256).
# Pull requests only plan — full builds run on version tags.
pr-run-mode = "plan"
# Keep hand edits to .github/workflows/release.yml (fail-fast=true so a
# missing Windows target cannot ship).
allow-dirty = ["ci"]
