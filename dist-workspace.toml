# cargo-dist workspace root. The Cargo workspace itself lives under rust/;
# this file sits at the git root so `dist` (and the generated Release workflow)
# find a project without needing a checkout-relative `cd`.
[workspace]
members = ["cargo:./rust"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. Every asset they produce is a
# README contract (curl | sh, irm | iex, brew install), so the release gate
# (backend/go_orchestrator/devcouncil/release) requires each one by name.
installers = ["shell", "powershell"]
# Homebrew is off until the tap exists (task ft-0151590c). To turn it on, after
# creating the bharathvbcr/homebrew-tap repository and the HOMEBREW_TAP_TOKEN
# secret, add "homebrew" to installers and these two keys here:
#   tap = "bharathvbcr/homebrew-tap"
#   publish-jobs = ["homebrew"]
# and name the formula for the binary in rust/devmap-cli/Cargo.toml:
#   [package.metadata.dist]
#   formula = "devmap"
# cargo-dist builds the formula from that key alone, so the release gate
# refuses it while homebrew is off. Once all four are in, the gate requires
# devmap.rb, and release.yml's publish-homebrew-formula job runs because the
# plan names it.
# Same directory scripts/install.sh uses, so every install route agrees.
install-path = "~/.local/bin"
# Target platforms matching the existing CI matrix. Windows is required: a
# failed MSVC grammar build must fail the release rather than ship a silently
# missing target.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# Where to host releases
hosting = "github"
# Checksums are published beside every archive (sha256).
# Pull requests only plan — full builds run on version tags.
# Only `devmap-cli` is dist-able. Analysis binaries and test helpers set
# `[package.metadata.dist] dist = false` so cargo-dist cannot ship
# `hold_uncommitted_child` or take the release down with tgrep-core on MSVC.
pr-run-mode = "plan"
# Keep hand edits to .github/workflows/release.yml (fail-fast=true so a
# missing Windows target cannot ship).
allow-dirty = ["ci"]
