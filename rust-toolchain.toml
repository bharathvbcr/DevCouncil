# The one owner of the Rust toolchain for rust/, rust/gusset-engine and
# rust/dc-sparse-encode, locally and in CI. Every workflow installs it through
# .github/actions/setup-rust, which reads this file; no workflow names a
# channel. An unpinned `stable` under `-D warnings` broke main when a new
# release deprecated an API the tree used.
#
# Bump deliberately, in its own change: edit `channel`, run
# `cargo fmt --all -- --check` and the clippy commands from
# .github/workflows/rust.yml and analysis-plane.yml, fix what the new release
# flags, then update `rust-version` in rust/Cargo.toml,
# rust/dc-sparse-encode/Cargo.toml, rust/rank-eval/Cargo.toml and
# rust/gusset-engine/Cargo.toml to the same minor. See the release
# checklist in docs/workflow.md ("Bumping the pinned toolchains").
[toolchain]
channel = "1.100.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
