[package]
name = "devmap-resolve"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Already a workspace dependency built for devmap-extract and devmap-store, so
# no new crate enters the tree; resolution is the last serial CPU phase.
rayon.workspace = true
devmap-extract = { path = "../devmap-extract", default-features = false }
serde.workspace = true

[features]
default = ["parse"]
# Forwards the parsing frontend. Off, this crate builds without tree-sitter
# and answers questions about a persisted map rather than building one.
parse = ["devmap-extract/parse"]
