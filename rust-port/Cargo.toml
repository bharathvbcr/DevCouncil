[workspace]
resolver = "2"
members = [
    "crates/devmap-extract",
    "crates/devmap-resolve",
    "crates/devmap-analyze",
    "crates/devmap-store",
    "crates/devmap-query",
    "crates/devmap-serve",
    "crates/devmap-cli",
]

# The release profile was left at cargo's defaults, which are tuned for build
# time: `codegen-units = 16` splits each crate into units optimized in isolation,
# and cross-crate inlining is off. That is the wrong trade for this binary. It is
# built rarely and run on every agent turn, and its hot loops — tree-sitter
# walks in `devmap-extract`, the symbol-index lookups in `devmap-resolve` — cross
# crate boundaries constantly, which is exactly what a unified codegen unit and
# LTO can see through.
#
# `lto = "thin"` rather than `"fat"`: measured on this workspace, thin recovers
# effectively all of fat's runtime win for a fraction of the link time.
[profile.release]
lto = "thin"
codegen-units = 1
# Abort rather than unwind. The CLI has no `catch_unwind` recovery anywhere — a
# panic already ends the process — so unwinding tables are landing-pad code and
# inlining barriers for a path that never runs. Tests keep the default unwind
# profile, so `#[should_panic]` coverage is unaffected.
panic = "abort"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["DevCouncil Team"]
license = "MIT"

[workspace.dependencies]
# "rc" lets Arc<T> derive Serialize/Deserialize. ResolvedEdge shares one
# Resolution across every edge fanned out from the same ambiguous call site;
# Arc<T> serializes as the inner T, so the wire form is unchanged.
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
rayon = "1.10"
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive", "env"] }
regex = "1.10"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "6.1"
ignore = "0.4"
tree-sitter = "0.25"
tree-sitter-language = "0.1"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-go = "0.23"
tree-sitter-hcl = "1.1"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-php = "0.24"
tree-sitter-ruby = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-objc = "3.0"
tree-sitter-cuda = "0.21"
tree-sitter-swift = "0.7"
tree-sitter-scala = "0.26"
tree-sitter-dart = "0.2"
tree-sitter-pascal = "0.10"
tree-sitter-lua = "0.5"
tree-sitter-luau = "1.2"
tree-sitter-r = "1.3"
tree-sitter-cfml = "0.26"
tree-sitter-erlang = "0.20"
tree-sitter-solidity = "1.2"
# Shell and SQL are not in the frozen Python 35, so they have no LanguageSpec.
# `detect_language` already routes `.sh`/`.bash`/`.zsh` to "shell" and `.sql` to
# "sql" through its fallback table, and both returned ParseOutcome::Failed for
# want of a grammar — 86 shell and 19 SQL files on the personal corpus.
tree-sitter-bash = "0.25"
tree-sitter-sequel = "0.3"
tree-sitter-nix = "0.3"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-svelte-ng = "1.0"
tree-sitter-astro-next = "0.1"
